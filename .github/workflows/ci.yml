name: CI

on:
  pull_request:
  push:

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # `--allow-multiple-definition` works around a duplicate `__rust_probestack`: Nitro's Wasmer
      # fork vendors its own copy alongside the one in Rust's compiler_builtins. GNU ld accepted
      # that, rust-lld (default from the 1.97 toolchain) does not. See .cargo/config.toml, which
      # carries the same flag for local Linux builds; setting RUSTFLAGS here overrides that file
      # entirely, so the flag has to be repeated.
      RUSTFLAGS: -D warnings -C link-arg=-Wl,--allow-multiple-definition
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
