[package]
name = "arb-reth-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Tier-1 engine-tree driver: `ArbEngineDriver` stands up reth's `EngineApiTreeHandler` and mints
# execute-to-derive blocks via `InsertExecutedBlock` + `ForkchoiceUpdated` (no re-execution), with
# the direct engine-tree block-production path. Also owns the payload-type stubs that only exist
# to satisfy `NodeTypes::Payload` (`ArbPayloadTypes`/`ArbExecutionData`/...) and the minimal
# `ArbPayloadValidator` / `ConfigureEngineEvm` impls. Split out of `arb-reth-node`.

[dependencies]
arbitrum-alloy-consensus = { git = "https://github.com/nuntax/arbitrum-alloy", rev = "83593650bf6d07d2255e8627c417a9236cd5d02b", default-features = false, features = ["reth"] }
arb-reth-evm = { path = "../arb-reth-evm" }
arb-revm.workspace = true
arbitrum-alloy-sequencer = { git = "https://github.com/nuntax/arbitrum-alloy", rev = "83593650bf6d07d2255e8627c417a9236cd5d02b", default-features = false, features = ["std"] }

alloy-consensus = { version = "2.0", default-features = false }
alloy-eips = { version = "2.0", default-features = false }
alloy-primitives = { version = "1", default-features = false }
alloy-rpc-types-engine = { version = "2.0", default-features = false, features = ["serde"] }
eyre = "0.6.12"
metrics = "0.24"
rayon = "1"
serde = { version = "1", default-features = false, features = ["derive"] }
tracing = "0.1"
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
revm = { workspace = true }
revm-database = "42.0.0"

reth-chain-state = { git = "https://github.com/nuntax/reth.git", rev = "9cc1ea540a32b57aa39c83064edbf94ab71e0784" }
reth-basic-payload-builder = { git = "https://github.com/nuntax/reth.git", rev = "9cc1ea540a32b57aa39c83064edbf94ab71e0784" }
reth-consensus = { git = "https://github.com/nuntax/reth.git", rev = "9cc1ea540a32b57aa39c83064edbf94ab71e0784" }
reth-engine-primitives = { git = "https://github.com/nuntax/reth.git", rev = "9cc1ea540a32b57aa39c83064edbf94ab71e0784" }
reth-engine-tree = { git = "https://github.com/nuntax/reth.git", rev = "9cc1ea540a32b57aa39c83064edbf94ab71e0784" }
reth-evm = { git = "https://github.com/nuntax/reth.git", rev = "9cc1ea540a32b57aa39c83064edbf94ab71e0784" }
reth-execution-cache = { git = "https://github.com/nuntax/reth.git", rev = "9cc1ea540a32b57aa39c83064edbf94ab71e0784" }
reth-execution-types = { git = "https://github.com/nuntax/reth.git", rev = "9cc1ea540a32b57aa39c83064edbf94ab71e0784" }
reth-exex-types = { git = "https://github.com/nuntax/reth.git", rev = "9cc1ea540a32b57aa39c83064edbf94ab71e0784" }
reth-payload-builder = { git = "https://github.com/nuntax/reth.git", rev = "9cc1ea540a32b57aa39c83064edbf94ab71e0784" }
reth-payload-primitives = { git = "https://github.com/nuntax/reth.git", rev = "9cc1ea540a32b57aa39c83064edbf94ab71e0784" }
reth-primitives-traits = { version = "0.6.0", default-features = false }
reth-provider = { git = "https://github.com/nuntax/reth.git", rev = "9cc1ea540a32b57aa39c83064edbf94ab71e0784" }
reth-prune = { git = "https://github.com/nuntax/reth.git", rev = "9cc1ea540a32b57aa39c83064edbf94ab71e0784" }
reth-revm = { git = "https://github.com/nuntax/reth.git", rev = "9cc1ea540a32b57aa39c83064edbf94ab71e0784" }
reth-stages-api = { git = "https://github.com/nuntax/reth.git", rev = "9cc1ea540a32b57aa39c83064edbf94ab71e0784" }
reth-storage-api = { git = "https://github.com/nuntax/reth.git", rev = "9cc1ea540a32b57aa39c83064edbf94ab71e0784", features = ["db-api"] }
reth-storage-overlay = { git = "https://github.com/nuntax/reth.git", rev = "9cc1ea540a32b57aa39c83064edbf94ab71e0784" }
reth-tasks = { git = "https://github.com/nuntax/reth.git", rev = "9cc1ea540a32b57aa39c83064edbf94ab71e0784" }
reth-trie = { git = "https://github.com/nuntax/reth.git", rev = "9cc1ea540a32b57aa39c83064edbf94ab71e0784" }
